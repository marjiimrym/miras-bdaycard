<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Mira 🍒</title>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Caveat:wght@600;700&family=Playfair+Display:wght@900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--pink:#e58aac;--rose:#f7c6d8;--red:#9b1c24;--cream:#f7f1e6;--ink:#2b1b1b;--sand:#d9cbb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;overflow-x:hidden;font-family:'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);
background-color:var(--pink);
background-image:linear-gradient(#ffffff55 2px,transparent 2px),linear-gradient(90deg,#ffffff55 2px,transparent 2px),
radial-gradient(circle at 30% 25%,#ffe3ee,#e58aac 75%),linear-gradient(135deg,#fff5,#0001);
background-size:60px 60px,60px 60px,60px 60px,120px 120px}
.scene{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px 16px;position:relative;text-align:center;overflow:hidden}
.sash{background:linear-gradient(#e6dcc5,#cfc1a2);font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(26px,8vw,46px);padding:8px 34px;transform:rotate(-4deg);box-shadow:2px 4px 0 #0003;letter-spacing:1px;
background-image:radial-gradient(#fff8 1px,transparent 1.5px),linear-gradient(#e6dcc5,#cfc1a2);background-size:6px 6px,auto}
.tag{background:var(--sand);padding:6px 18px;border-radius:6px 20px 6px 20px;font-family:'Caveat',cursive;font-size:30px;color:var(--red);transform:rotate(-4deg);box-shadow:2px 3px 0 #0003}
.strip{display:flex;gap:10px;padding:16px 22px;background:#151515;transform:rotate(2deg);box-shadow:0 6px 16px #0004;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,var(--cream) 0 10px,transparent 10px 20px)}
.strip::before{top:4px}.strip::after{bottom:4px}
.frame{width:72px;height:88px;background:#fff;display:grid;place-items:center;font-size:32px}
.btn{font-family:'Caveat',cursive;font-size:30px;font-weight:700;border:0;cursor:pointer;color:#fff;padding:14px 32px;border-radius:60px;
background:linear-gradient(#c8323c,var(--red));box-shadow:0 5px 0 #5c0e14,0 10px 18px #0004;animation:pulse 1.8s infinite}
.btn:active{transform:translateY(3px)}
@keyframes pulse{50%{transform:scale(1.06)}}
.hint{font-size:20px;color:#fff;text-shadow:1px 1px 0 #0003}
.deco{position:absolute;font-size:36px;animation:bob 3s ease-in-out infinite}
.bow{position:absolute;width:90px;animation:bob 4s ease-in-out infinite}
.star{font-size:44px;background:linear-gradient(135deg,#fff,#9aa1ad 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1px 2px 0 #0004)}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.overlay{overflow-x:hidden;position:fixed;inset:0;background:#3a0f1dcc;display:none;align-items:center;justify-content:center;padding:40px 34px;z-index:10;overflow-y:auto}
.overlay.open{display:flex}
.polaroid{position:relative;width:min(540px,100%);margin:auto;background:var(--cream);padding:16px 16px 22px;box-shadow:0 20px 50px #000a;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both;transform:rotate(-1deg)}
@keyframes pop{from{transform:scale(.2) rotate(-10deg);opacity:0}}
.photo{background-image:linear-gradient(#ffffff40 2px,transparent 2px),linear-gradient(90deg,#ffffff40 2px,transparent 2px),radial-gradient(circle at 30% 25%,#f49bbb,#b8446e 85%);background-size:44px 44px,44px 44px,44px 44px;padding:24px 10px 18px;text-align:center;border:3px solid #151515}
.balloon{font-family:'Modak','Impact',sans-serif;line-height:.85;margin:0;font-size:clamp(50px,15vw,88px);letter-spacing:1px;
background:linear-gradient(180deg,#fff 0%,#c4cad6 40%,#f5f7fa 52%,#8e97a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
-webkit-text-stroke:2px #6d7686;filter:drop-shadow(3px 5px 0 #0005)}
.balloon span{display:block;animation:float 3s ease-in-out infinite}
.balloon span:nth-child(2){animation-delay:.4s}.balloon span:nth-child(3){animation-delay:.8s;font-size:1.15em}
@keyframes float{50%{transform:translateY(-6px)}}
.msg{font-family:'Caveat',cursive;font-size:clamp(24px,6vw,30px);line-height:1.2;text-align:center;margin:16px 6px 6px}
.msg b{color:var(--red)}
.sign{font-family:'Caveat',cursive;font-size:30px;text-align:left;padding-left:10px}
.love{position:absolute;right:18px;bottom:14px;font-size:30px;transform:rotate(12deg)}
.close{position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;border:3px solid #151515;background:#fff;font-size:20px;cursor:pointer}
.confetti{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.st{position:absolute;pointer-events:none;height:auto;animation:bob 3.5s ease-in-out infinite}.rel{height:auto;max-width:90vw}
</style>
</head>
<body>
<div class="scene">
  <svg class="bow" style="top:1%;left:1%" viewBox="0 0 100 70"><path d="M50 35C30 0 0 5 5 30C8 55 35 45 50 35ZM50 35C70 0 100 5 95 30C92 55 65 45 50 35Z" fill="#9b1c24"/><rect x="43" y="27" width="14" height="16" rx="5" fill="#7a1219"/><path d="M47 42L30 68L42 62L48 45ZM53 42L70 68L58 62L52 45Z" fill="#9b1c24"/></svg>
  <img class="st" src="assets/disco.png" alt="" style="right:4%;top:2%;width:74px">
  <img class="st" src="assets/party_hat.png" alt="" style="left:27%;top:1%;width:44px;animation-delay:.7s">
  <span class="deco" style="top:22%;right:6%;animation-delay:.6s">🍒</span>
  <span class="deco" style="top:30%;left:5%;animation-delay:1s">🦋</span>
  <img class="st" src="assets/plush.png" alt="" style="left:3%;bottom:2%;width:104px;animation-delay:.3s">
  <img class="st" src="assets/kitty_cake.png" alt="" style="right:3%;bottom:1%;width:92px;animation-delay:1.3s">
  <img class="st" src="assets/green_star.png" alt="" style="right:5%;top:36%;width:40px;animation-delay:.9s">
  <span class="deco star" style="bottom:22%;left:16%;animation-delay:.9s">✦</span>
  <div class="sash">BIRTHDAY GIRL</div>
  <div class="strip"><div class="frame">🍒</div><div class="frame">🎀</div><div class="frame">💋</div></div>
  <img class="rel" src="assets/tag.png" alt="" style="width:190px;transform:rotate(-4deg)">
  <button class="btn" id="open">Open your card 💌</button>
  <div class="hint">tap me, Mira ✨</div>
</div>

<div class="overlay" id="ov">
  <div class="polaroid">
    <button class="close" id="close" aria-label="Close">✕</button>
    <img class="st" src="assets/kitty_cake.png" alt="" style="width:80px;left:-30px;bottom:-30px"><img class="st" src="assets/plush.png" alt="" style="width:92px;right:-30px;bottom:-34px;animation-delay:.6s"><img class="st" src="assets/iloveyou.png" alt="" style="width:52px;right:-22px;top:36px;animation-delay:.3s">
    <div class="photo">
      <div class="balloon"><span>HAPPY</span><span>BIRTHDAY</span><span>MIRA</span></div>
    </div>
    <div class="msg">Thank you soo much for being my friend for since before <b>slushynoobz</b> even became a thing!</div>
    <div class="sign">With love,</div>
    <span class="love">💋</span>
  </div>
</div>

<script>
var ov=document.getElementById('ov');
function burst(){
  var e=['🍒','🎀','❤️','🦋','💋','✨','🌺'];
  for(var i=0;i<45;i++){
    var s=document.createElement('span');
    s.className='confetti';
    s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    setTimeout(function(x){x.remove()},8000,s);
  }
}
document.getElementById('open').onclick=function(){ov.classList.add('open');burst()};
document.getElementById('close').onclick=function(){ov.classList.remove('open')};
ov.onclick=function(e){if(e.target===ov)ov.classList.remove('open')};
</script>
</body>
</html>
