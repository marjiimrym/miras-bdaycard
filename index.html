<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Mira 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--navy:#26355a;--navy2:#3b4f7d;--kraft:#e9c9a6;--ink:#3a2a22;--red:#c8323c;--sage:#7d9a76;--cream:#f6efe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;overflow-x:hidden;font-family:'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);
background:
radial-gradient(2px 2px at 12% 18%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 78% 12%,#fff9 50%,transparent 51%),
radial-gradient(3px 3px at 40% 30%,#fff8 50%,transparent 51%),radial-gradient(2px 2px at 90% 45%,#fff9 50%,transparent 51%),
radial-gradient(2px 2px at 22% 62%,#fff8 50%,transparent 51%),radial-gradient(3px 3px at 65% 75%,#fff8 50%,transparent 51%),
radial-gradient(2px 2px at 8% 88%,#fff9 50%,transparent 51%),radial-gradient(ellipse at 70% 90%,#cfc6bd66,transparent 45%),
radial-gradient(ellipse at 30% 10%,#5a70a5,transparent 60%),var(--navy);background-color:var(--navy)}
.scene{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px;position:relative;text-align:center}
.tag{background:var(--kraft);padding:8px 18px;border-radius:6px 22px 6px 22px;font-family:'Caveat',cursive;font-size:30px;color:var(--red);transform:rotate(-5deg);box-shadow:2px 3px 0 #0004}
.strip{display:flex;gap:10px;padding:14px 22px;background:#1b1b1d;border-radius:6px;transform:rotate(-2deg);box-shadow:0 6px 18px #0006;position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,var(--cream) 0 10px,transparent 10px 20px)}
.strip::before{top:3px}.strip::after{bottom:3px}
.frame{width:74px;height:90px;background:linear-gradient(160deg,var(--navy2),var(--navy));border:2px solid #ddd;display:grid;place-items:center;font-size:30px}
.frame:nth-child(2){transform:translateY(2px)}
.btn{font-family:'Caveat',cursive;font-size:30px;font-weight:700;border:0;cursor:pointer;color:var(--ink);padding:14px 30px;border-radius:60px;
background:linear-gradient(#f4e3b5,#c9a86a);box-shadow:0 5px 0 #8a6c3a,0 10px 20px #0006;animation:pulse 1.8s infinite}
.btn:active{transform:translateY(3px)}
@keyframes pulse{50%{transform:scale(1.06)}}
.deco{position:absolute;font-size:34px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.hint{font-size:20px;color:#e8e2d2}
.overlay{overflow-x:hidden;position:fixed;inset:0;background:#0a1226cc;display:none;align-items:center;justify-content:center;padding:40px 34px;z-index:10;overflow-y:auto}
.overlay.open{display:flex}
.card{position:relative;width:min(560px,100%);margin:auto;background:radial-gradient(1.5px 1.5px at 20% 20%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 80% 40%,#fff9 50%,transparent 51%),linear-gradient(#324570,var(--navy));
border:6px solid #1b1b1d;border-radius:14px;padding:30px 20px 26px;text-align:center;box-shadow:0 20px 50px #000a;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.bubble{position:absolute;top:-24px;left:-6px;background:var(--kraft);padding:6px 14px;border-radius:14px;font-size:17px;transform:rotate(-4deg);box-shadow:2px 2px 0 #0004}
.balloon{font-family:'Modak','Impact',sans-serif;line-height:.85;margin:14px 0 10px;
font-size:clamp(52px,15vw,92px);letter-spacing:1px;
background:linear-gradient(180deg,#fff 0%,#c4cad6 40%,#f5f7fa 52%,#8e97a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
-webkit-text-stroke:2px #6d7686;filter:drop-shadow(3px 5px 0 #0006)}
.balloon span{display:block;animation:float 3s ease-in-out infinite}
.balloon span:nth-child(2){animation-delay:.4s}.balloon span:nth-child(3){animation-delay:.8s;font-size:1.15em}
@keyframes float{50%{transform:translateY(-6px)}}
.note{background:var(--kraft);border-radius:4px 20px 4px 20px;padding:18px 20px;margin:18px auto 8px;font-family:'Caveat',cursive;font-size:clamp(24px,6vw,30px);line-height:1.2;transform:rotate(-1.5deg);box-shadow:3px 4px 0 #0005}
.note b{color:var(--red)}
.row{display:flex;justify-content:center;gap:10px;font-size:28px;margin-top:10px}
.close{position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;border:3px solid #1b1b1d;background:var(--cream);font-size:20px;cursor:pointer}
.confetti{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.st{position:absolute;pointer-events:none;height:auto;animation:bob 3.5s ease-in-out infinite}.rel{height:auto;max-width:90vw}
.frame{width:84px;height:102px;overflow:hidden;padding:0}.frame img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div class="scene">
<img class="st" src="assets/party_hat.png" alt="" style="left:5%;top:3%;width:52px">
  <img class="st" src="assets/disco.png" alt="" style="right:4%;top:2%;width:80px;animation-delay:.5s">
  <img class="st" src="assets/gold_star.png" alt="" style="left:22%;top:9%;width:36px;animation-delay:1s">
  <img class="st" src="assets/blue_star.png" alt="" style="right:26%;top:12%;width:42px;animation-delay:.2s">
  <img class="st" src="assets/camera.png" alt="" style="left:2%;bottom:2%;width:112px">
  <img class="st" src="assets/cake.png" alt="" style="right:2%;bottom:1%;width:120px;animation-delay:.8s">
  <img class="st" src="assets/sun.png" alt="" style="left:36%;bottom:3%;width:50px;animation-delay:1.2s">
  <img class="st" src="assets/green_star.png" alt="" style="right:34%;bottom:10%;width:44px;animation-delay:.4s">
    <img class="rel" src="assets/tag.png" alt="" style="width:190px;transform:rotate(-4deg)">
  <img class="rel" src="assets/happy_birthday.png" alt="" style="width:min(330px,84vw)">
  <div class="strip"><div class="frame"><img src="assets/photo1.jpg" alt=""></div><div class="frame"><img src="assets/photo2.jpg" alt=""></div><div class="frame"><img src="assets/photo3.jpg" alt=""></div></div>
  <button class="btn" id="open">Open your card 💌</button>
  <div class="hint">tap me, Mira ✨</div>
</div>

<div class="overlay" id="ov">
  <div class="card">
    <button class="close" id="close" aria-label="Close">✕</button>
    <img class="st" src="assets/kitty_cake.png" alt="" style="width:84px;left:-30px;bottom:-34px"><img class="st" src="assets/plush.png" alt="" style="width:96px;right:-30px;bottom:-36px;animation-delay:.6s"><img class="st" src="assets/iloveyou.png" alt="" style="width:54px;right:-24px;top:40px;animation-delay:.3s">
    <div class="bubble">TO MY BESTTTTTT GIRLLLLL!</div>
    <div class="balloon"><span>HAPPY</span><span>BIRTHDAY</span><span>MIRA</span></div>
    <div class="note">Happy Birthday to the prettiest and most deserving girl in my life! Thank you being in my life and I really hope nothing ever gets in the way of that. You are the hamzah to my martin!</div>
    <div class="row">🥳🥳🥳🥳🥳🥳🥳🥳</div>
  </div>
</div>

<script>
var ov=document.getElementById('ov');
function burst(){
  var e=['❤️','⭐','🎀','🦋','✨'];
  for(var i=0;i<45;i++){
    var s=document.createElement('span');
    s.className='confetti';
    s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'vw';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    setTimeout(function(x){x.remove()},8000,s);
  }
}
document.getElementById('open').onclick=function(){ov.classList.add('open');burst()};
document.getElementById('close').onclick=function(){ov.classList.remove('open')};
ov.onclick=function(e){if(e.target===ov)ov.classList.remove('open')};
</script>
</body>
</html>
